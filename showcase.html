<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2e8d2">
<title>Pixel Orbit · Artwork Showcase</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
iframe{display:block;width:100%;height:100%;border:0;background:transparent}
</style>
</head>
<body>
<iframe id="orbit-artwork" title="Pixel Orbit circular artwork" allow="fullscreen"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const scene = params.get("scene") === "planet" ? "planet" : "countryside";
  const composition = params.get("composition") === "art" ? "art" : "full";
  const page = scene === "planet" ? "pixel-orbit-planet.html" : "pixel-orbit.html";
  const artwork = document.getElementById("orbit-artwork");
  let activeComposition = composition;
  artwork.src = `./${page}?showcase=1&composition=${composition}&v=2`;

  const relayComposition = next => {
    if (next !== "art" && next !== "full") return;
    activeComposition = next;
    artwork.contentWindow?.postMessage({ type: "pixel-orbit-composition", composition: next }, location.origin);
  };
  artwork.addEventListener("load", () => relayComposition(activeComposition));
  window.addEventListener("message", event => {
    if (!event.data) return;

    // The artwork page announces readiness only after its first rendered frames.
    if (event.source === artwork.contentWindow && event.data.type === "pixel-orbit-ready") {
      window.parent.postMessage({ type: "pixel-orbit-ready", scene }, "*");
      return;
    }

    if (event.source !== window.parent || event.data.type !== "pixel-orbit-composition") return;
    relayComposition(event.data.composition);
  });
</script>
</body>
</html>
