<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2e8d2">
<title>Pixel Orbit · Artwork Showcase</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
iframe{display:block;width:100%;height:100%;border:0;background:transparent}
</style>
</head>
<body>
<iframe id="orbit-artwork" title="Pixel Orbit circular artwork" allow="fullscreen"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const requestedScene = params.get("scene");
  const scene = ["countryside", "planet", "world"].includes(requestedScene) ? requestedScene : "countryside";
  const composition = params.get("composition") === "art" ? "art" : "full";
  const page = scene === "planet" ? "pixel-orbit-planet.html" : scene === "world" ? "pixel-orbit-world.html" : "pixel-orbit.html";
  const artwork = document.getElementById("orbit-artwork");
  let activeComposition = composition;
  let artworkReady = false;

  // 作品页的缓存版本号不再靠人手改数字：直接拿作品文件自己的 ETag 当版本号。
  // GitHub Pages 给每个文件都发 ETag，文件一改 ETag 就变，
  // 浏览器于是立刻拿到新版本，不会再出现"改了但用户看到的还是旧版"。
  const buildOf = async () => {
    try {
      const res = await fetch(`./${page}`, { method: "HEAD", cache: "no-store" });
      const etag = res.headers.get("etag");
      return etag ? etag.replace(/[^\w-]/g, "") : "";
    } catch (_) { return ""; }
  };
  const loadArtwork = async () => {
    const build = await buildOf();
    artwork.src = `./${page}?showcase=1&composition=${composition}` + (build ? `&v=${build}` : "&v=7");
  };
  loadArtwork();

  const announceReady = () => {
    if (artworkReady) window.parent.postMessage({ type: "pixel-orbit-ready", scene }, "*");
  };
  const relayComposition = next => {
    if (next !== "art" && next !== "full") return;
    activeComposition = next;
    artwork.contentWindow?.postMessage({ type: "pixel-orbit-composition", composition: next }, location.origin);
  };
  artwork.addEventListener("load", () => relayComposition(activeComposition));
  window.addEventListener("message", event => {
    if (!event.data) return;

    // The artwork page announces readiness only after its first rendered frames.
    if (event.source === artwork.contentWindow && event.data.type === "pixel-orbit-ready") {
      artworkReady = true;
      announceReady();
      return;
    }

    if (event.source !== window.parent) return;
    if (event.data.type === "pixel-orbit-ping") { announceReady(); return; }
    if (event.data.type !== "pixel-orbit-composition") return;
    relayComposition(event.data.composition);
  });
</script>
</body>
</html>
