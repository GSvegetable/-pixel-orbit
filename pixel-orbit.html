<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="pageTitle">Pixel Orbit · 像素圆环开关</title>
<style>
  /* ---------- 页面：背景和文字随 --night（0 白天 → 1 夜晚）渐变 ---------- */
  :root { --night: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center;
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #f2e8d2; color: #1b2146;
    background: color-mix(in oklab, #f2e8d2 calc((1 - var(--night)) * 100%), #0c1030);
    color: color-mix(in oklab, #1b2146 calc((1 - var(--night)) * 100%), #f5ecd9);
  }
  main { display: grid; gap: 1.5rem; justify-items: center; padding: 2rem 1rem; text-align: center; }
  h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .hint { margin: 0; opacity: .65; font-size: .8rem; }
  output { font-size: 1.4rem; letter-spacing: .12em; font-variant-numeric: tabular-nums; min-height: 1.6em; }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; color: inherit; background: transparent; cursor: pointer; padding: .45rem .9rem;
    border: 2px solid currentColor; border-radius: 0; box-shadow: 3px 3px 0 currentColor; transition: transform .08s, box-shadow .08s;
  }
  button:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 currentColor; }
  button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 currentColor; }
  button:focus-visible { outline: 3px solid #efa02c; outline-offset: 3px; }
  button[aria-pressed="true"] { transform: translate(3px, 3px); box-shadow: inset 0 0 0 2px currentColor; }

  /* ---------- 组件：.pixel-orbit ---------- */
  .pixel-orbit {
    /* 想换配色只改这 5 个变量，画面里所有颜色都由它们推导出来 */
    --orbit-bg: #f5ecd9; --orbit-surface: #8c9a62; --orbit-fg: #1b2146; --orbit-muted: #7f97b3; --orbit-accent: #efa02c;
    --orbit-size: min(84vw, 460px);
    width: var(--orbit-size); aspect-ratio: 1; display: grid; place-items: center;
    border-radius: 50%; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .pixel-orbit:active { cursor: grabbing; }
  .pixel-orbit:focus-visible { outline: 3px solid var(--orbit-accent); outline-offset: 8px; }
  .pixel-orbit canvas { display: block; image-rendering: pixelated; pointer-events: none; filter: drop-shadow(0 .9rem 1.4rem rgb(0 0 0 / .3)); }

  /* ---------- 操作面板：不干预像素画布，只增强外围体验 ---------- */
  .time-panel { width:min(100%, 460px); display:grid; gap:.7rem; text-align:left; }
  .time-head { display:flex; align-items:center; justify-content:space-between; gap:1rem; font-size:.72rem; letter-spacing:.08em; opacity:.8; }
  .time-head output { font-size:.8rem; letter-spacing:0; min-height:0; }
  input[type="range"] { width:100%; accent-color:var(--orbit-accent, #efa02c); cursor:pointer; }
  .preset-row { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.5rem; width:min(100%,460px); }
  .preset-row button { padding:.45rem .3rem; font-size:.75rem; }
  .preset-row button[aria-pressed="true"] { background:color-mix(in oklab,currentColor 10%,transparent); }
  .row button { min-width:5.5rem; }
  .hint { max-width:38rem; }
  button:disabled,input:disabled { opacity:.5; cursor:not-allowed; }
  @media (max-width:420px) { main { gap:1.1rem; padding:1.4rem .8rem; } .pixel-orbit { --orbit-size:min(88vw,460px); } .preset-row { gap:.35rem; } .preset-row button { font-size:.68rem; } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition-duration:.01ms !important; animation-duration:.01ms !important; } }

  main{width:min(100%,620px);gap:1.15rem}.brandline{font-size:.65rem;letter-spacing:.2em;opacity:.65}.brandline:before,.brandline:after{content:"";display:inline-block;width:22px;height:1px;background:currentColor;vertical-align:middle;margin:0 .6rem}h1{font-size:1.15rem;letter-spacing:.24em}.subline{margin:-.8rem 0 0;font-size:.72rem;opacity:.58}
  .control-shell{width:min(100%,460px);border:1px solid color-mix(in oklab,currentColor 18%,transparent);padding:1rem;display:grid;gap:1rem;background:color-mix(in oklab,currentColor 3%,transparent)}
  .clockline{display:flex;align-items:baseline;justify-content:center;gap:.65rem}#clock{font-size:clamp(1.6rem,6vw,2rem);font-weight:600;letter-spacing:.08em}#phase{font-size:.72rem;opacity:.7}
  .time-panel{width:100%;gap:.4rem}.time-head{font-size:.66rem}input[type=range]{width:100%;accent-color:var(--orbit-accent,#efa02c)}.range-ends{display:flex;justify-content:space-between;font-size:.6rem;opacity:.45}
  .preset-row{width:100%}.preset-row button{border-width:1px;box-shadow:2px 2px 0 currentColor;font-size:.68rem}
  .action-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}.action-row button{min-width:0;padding:.55rem .3rem;font-size:.7rem}
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;text-align:left}.setting{display:grid;gap:.3rem;min-width:0}.setting label{font-size:.63rem;opacity:.65;letter-spacing:.06em}
  select{width:100%;color:inherit;background:transparent;border:1px solid color-mix(in oklab,currentColor 32%,transparent);border-radius:0;padding:.5rem .4rem;font-size:.7rem}
  .secondary-row{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}.text-button{border:0;box-shadow:none;padding:.2rem;font-size:.66rem;opacity:.7;text-decoration:underline;text-underline-offset:3px}.text-button:hover{box-shadow:none;transform:none;opacity:1}
  .status{display:flex;justify-content:center;gap:.45rem;font-size:.62rem;opacity:.58}.status-dot{width:6px;height:6px;border-radius:50%;background:#83a66a;margin-top:.45rem}
  details{border-top:1px solid color-mix(in oklab,currentColor 16%,transparent);padding-top:.65rem;text-align:left}summary{cursor:pointer;font-size:.66rem;opacity:.65}.diagnostics{display:grid;grid-template-columns:1fr auto;gap:.35rem .8rem;padding-top:.7rem;font-size:.62rem;opacity:.7}.diagnostics output{font-size:inherit;min-height:0;letter-spacing:0}
  footer{font-size:.58rem;opacity:.4;letter-spacing:.1em}@media(max-width:420px){main{gap:.9rem;padding:1rem .7rem}.control-shell{padding:.8rem}.settings-grid{gap:.5rem}.action-row{gap:.35rem}}
</style>
</head>
<body>
<main>
  <div class="brandline">A LITTLE WORLD IN MOTION</div>
  <h1>PIXEL ORBIT</h1>
  <p class="subline" data-i18n="subtitle">一座随时间呼吸的像素小世界</p>
  <div class="pixel-orbit" data-pixel-orbit data-hour="now" data-sync="root" aria-label="昼夜圆环开关"></div>
  <section class="control-shell" aria-label="时间与外观控制">
    <div class="clockline"><output id="clock" aria-live="polite">--:--</output><span id="phase">正在初始化</span></div>
    <section class="time-panel" aria-label="时间控制">
      <div class="time-head"><label for="time-range" data-i18n="timeOfDay">一天中的时间</label><output id="time-value" for="time-range">12:00</output></div>
      <input id="time-range" type="range" min="0" max="1439" step="1" value="720" aria-label="调整一天中的时间">
      <div class="range-ends"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
    </section>
    <div class="preset-row" aria-label="快速时间预设">
      <button type="button" data-preset="6" aria-pressed="false" data-i18n="dawn">☀ 清晨</button>
      <button type="button" data-preset="12" aria-pressed="false" data-i18n="noon">☼ 正午</button>
      <button type="button" data-preset="18" aria-pressed="false" data-i18n="dusk">◒ 黄昏</button>
      <button type="button" data-preset="23" aria-pressed="false" data-i18n="lateNight">☾ 深夜</button>
    </div>
    <div class="action-row">
      <button type="button" id="btn-day" data-i18n="day">☀ 白天</button>
      <button type="button" id="btn-night" data-i18n="night">☾ 夜晚</button>
      <button type="button" id="btn-auto" aria-pressed="false" data-i18n="play">▶ 自动漫游</button>
    </div>
    <div class="settings-grid">
      <div class="setting"><label for="speed-range" data-i18n="speed">时间流速</label><input id="speed-range" type="range" min="12" max="180" step="6" value="48"><output id="speed-value">48 秒 / 天</output></div>
      <div class="setting"><label for="theme-select" data-i18n="palette">色彩氛围</label><select id="theme-select"><option value="default" data-i18n="themeDefault">原始田园</option><option value="coast" data-i18n="themeCoast">海岸薄雾</option><option value="lavender" data-i18n="themeLavender">薰衣草暮色</option><option value="amber" data-i18n="themeAmber">琥珀暖光</option></select></div>
      <div class="setting"><label for="language-select" data-i18n="language">界面语言</label><select id="language-select"><option value="zh-CN">简体中文</option><option value="en">English</option><option value="ja">日本語</option></select></div>
      <div class="setting"><label for="clock-mode" data-i18n="clockMode">时间显示</label><select id="clock-mode"><option value="24" data-i18n="clock24">24 小时</option><option value="12" data-i18n="clock12">12 小时</option></select></div>
    </div>
    <div class="secondary-row">
      <button type="button" class="text-button" id="btn-now" data-i18n="syncNow">↺ 回到本地当前时间</button>
      <button type="button" class="text-button" id="btn-reset" data-i18n="reset">恢复默认设置</button>
    </div>
    <div class="status"><span class="status-dot"></span><span id="status-text">运行正常 · 设置自动保存</span></div>
    <details>
      <summary data-i18n="diagnostics">运行诊断</summary>
      <div class="diagnostics">
        <span data-i18n="renderMode">渲染模式</span><output id="diag-render">Canvas 2D · 152×152</output>
        <span data-i18n="devicePixelRatio">设备像素比</span><output id="diag-dpr">—</output>
        <span data-i18n="viewport">视口尺寸</span><output id="diag-viewport">—</output>
        <span data-i18n="motionSetting">动态效果偏好</span><output id="diag-motion">—</output>
        <span data-i18n="storage">本地设置</span><output id="diag-storage">—</output>
      </div>
    </details>
  </section>
  <p class="hint" data-i18n="hint">拖动圆环调整时间 · 键盘方向键微调 · 空格切换昼夜</p>
  <footer>PIXEL ORBIT · MADE OF TINY MOMENTS</footer>
  <noscript><p>需要 JavaScript 才能显示像素画面。</p></noscript>
</main>

<script>
/* ============================================================
 *  Pixel Orbit —— 像素轨道开关
 *  圆形窗口里是一座田园小屋，窗口外的表盘圆环上有一枚旋钮（白天是太阳、夜里是月亮）。
 *  拖动圆环调整时间；点一下画面（或旋钮）在白天 / 夜晚之间切换。
 *  纯 JS，无依赖。调色只读取 5 个 CSS 变量，所有颜色都来自这 5 组 4 阶色带。
 * ============================================================ */
(() => {
  'use strict';
  const N = 152, CX = 76, CY = 76;            // 画布 152×152 像素，圆心 (76,76)
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const mix = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const bay = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;   // 4×4 有序抖动阈值 0..1
  const hash = (a, b, c = 0) => { let t = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177); t = Math.imul(t ^ (t >>> 13), 1274126177); return ((t ^ (t >>> 16)) >>> 0) / 4294967296; };

  // ---------- 调色：5 个基色各生成 4 阶明度（OKLab），共 20 色 ----------
  const lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const gam = (v) => { v = clamp(v); return 255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055); };
  const toLab = ([r, g, b]) => { const lr = lin(r), lg = lin(g), lb = lin(b); const l = Math.cbrt(0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb), m = Math.cbrt(0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb), s = Math.cbrt(0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb); return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s]; };
  const fromLab = (L, a, b) => { const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3; return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s]; };
  const tone = (rgb, L) => { const [, a, b] = toLab(rgb); let c = Math.hypot(a, b); const h = Math.atan2(b, a); for (let i = 0; i < 24; i++) { const o = fromLab(L, c * Math.cos(h), c * Math.sin(h)); if (o.every((v) => v > -0.002 && v < 1.002)) return o.map(gam); c *= 0.9; } return fromLab(L, 0, 0).map(gam); };
  const STEPS = [[0.76, 0.85, 0.93, 0.985], [0.4, 0.52, 0.64, 0.76], [0.17, 0.25, 0.33, 0.44], [0.5, 0.62, 0.74, 0.86], [0.5, 0.66, 0.8, 0.92]];
  const DEFAULTS = { bg: [245, 236, 217], surface: [140, 154, 98], fg: [27, 33, 70], muted: [127, 151, 179], accent: [239, 160, 44] };
  // 色带编号：C 奶油(bg) · G 草绿(surface) · I 深靛(fg) · U 雾蓝(muted) · A 琥珀(accent)，每组 +0..+3 由暗到亮
  const C = 0, G = 4, I = 8, U = 12, A = 16;
  const buildPalette = (colors = {}) => {
    const src = { ...DEFAULTS, ...colors }; const out = new Uint32Array(20);
    [src.bg, src.surface, src.fg, src.muted, src.accent].forEach((rgb, r) => STEPS[r].forEach((L, s) => { const [R, Gc, B] = tone(rgb, L); out[r * 4 + s] = (255 << 24) | (Math.round(B) << 16) | (Math.round(Gc) << 8) | Math.round(R); }));
    return out;
  };


  // ---------- 一天中的天空：每个关键时刻 4 个色阶（上 → 下），相邻两帧之间用抖动过渡 ----------
  const SKY = [
    [0, [I, I, I + 1, I + 2]], [5, [I, I + 1, I + 3, U]], [6.3, [I + 2, U, A + 1, A + 2]], [7.8, [U + 1, U + 2, U + 3, C + 2]], [12, [U + 1, U + 2, U + 3, C + 3]],
    [16.5, [U + 1, U + 2, U + 3, C + 2]], [18, [I + 3, U + 1, A + 2, A + 3]], [19.4, [I + 1, I + 3, U, A + 1]], [21, [I, I, I + 1, I + 2]], [24, [I, I, I + 1, I + 2]],
  ];
  // 材质：每种材质给 4 个色阶 [夜, 黄昏, 金色时刻, 白天]，和你原项目 MATS 的思路一样
  const MATS = [
    ['hillFar', [I + 1, I + 3, U + 1, U + 2]], ['hillNear', [I, I + 2, U, U + 1]], ['meadowFar', [I + 1, G, G + 1, G + 2]],
    ['grass', [I + 1, G, G + 1, G + 2]], ['grassLt', [I + 2, G + 1, G + 2, G + 3]], ['grassDk', [I, I + 1, G, G + 1]],
    ['leaf', [I, I + 1, G, G + 1]], ['leafMid', [I + 1, G, G + 1, G + 2]], ['leafLt', [I + 2, G + 1, G + 2, G + 3]],
    ['trunk', [I + 1, I + 3, A, A]], ['trunkLt', [I + 2, A, A + 1, A + 1]], ['wall', [I + 2, U + 1, A + 3, C + 3]], ['wallSh', [I + 1, U, A + 2, C + 2]],
    ['roof', [I, I + 1, I + 2, I + 3]], ['roofLt', [I + 1, I + 2, I + 3, U]], ['wood', [I + 1, I + 3, A, A]], ['woodLt', [I + 2, A, A + 1, A + 1]],
    ['win', [A + 3, A + 2, U + 2, U + 1]], ['stone', [I + 1, I + 2, U, U + 1]], ['stoneLt', [I + 3, U, U + 1, U + 2]],
    ['path', [I + 2, U, C, C + 1]], ['pathDk', [I + 1, I + 3, A, C]], ['flowerA', [I + 2, A, A + 2, A + 2]], ['flowerC', [I + 3, U + 1, C + 3, C + 3]],
    ['hair', [I, I, I + 1, I + 1]], ['skin', [I + 3, A + 1, A + 3, A + 3]], ['shirt', [I + 2, A, A + 1, A + 2]], ['pants', [I + 1, I + 2, I + 3, I + 2]],
  ];
  const M = {}; MATS.forEach(([name], i) => { M[name] = i + 1; });            // 0 = 天空
  const PERSON = ['.hhh.', '.hsh.', '.ttt.', 'ttttt', '.ttt.', '.ppp.', '.p.p.'];
  const PCH = { h: 'hair', s: 'skin', t: 'shirt', p: 'pants' };

  const createRenderer = (colors) => {
    const pal = buildPalette(colors); const buf = new Uint32Array(N * N); const mat = new Uint8Array(N * N);
    const LAD = MATS.map(([, l]) => l);
    const WORLD = 61.5, BEZ = 62, KNOB_R = 67.75, SUN_CX = 76, SUN_CY = 94, SUN_R = 57;   // 窗口半径 / 圆环内沿 / 旋钮轨道 / 窗内太阳轨道
    // ---------- 静态场景（只画一次） ----------
    const put = (x, y, m) => { x = Math.floor(x); y = Math.floor(y); if (x >= 0 && x < N && y >= 0 && y < N) mat[y * N + x] = m; };
    const rect = (x, y, w, h, m) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) put(x + i, y + j, m); };
    const disc = (cx, cy, r, m) => { for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) if ((x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2 <= r * r) put(x, y, m); };
    const n2 = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); return mix(mix(hash(xi, yi, 5), hash(xi + 1, yi, 5), u), mix(hash(xi, yi + 1, 5), hash(xi + 1, yi + 1, 5), u), v); };
    const farH = (x) => 86 + n2(x * 0.035 + 3, 1) * 9 - 3, midH = (x) => 94 + n2(x * 0.05 + 9, 4) * 5 - 2 * Math.sin(x * 0.04), meadowH = (x) => 100 + Math.sin(x * 0.045 + 0.6) * 2 + (n2(x * 0.12, 7) - 0.5) * 1.6;
    const paintScene = () => {
      for (let x = 0; x < N; x++) {
        for (let y = Math.floor(farH(x)); y < N; y++) put(x, y, y < farH(x) + 1.5 ? M.hillFar : (bay(x, y) < 0.25 ? M.hillNear : M.hillFar));
        for (let y = Math.floor(midH(x)); y < N; y++) put(x, y, y < midH(x) + 1 ? M.grassLt : (bay(x, y) < 0.3 ? M.grassDk : M.meadowFar));
        for (let y = Math.floor(meadowH(x)); y < N; y++) { const n = n2(x * 0.09 + 2, y * 0.22), d = y - meadowH(x); put(x, y, d < 1 ? M.grassLt : (n > 0.66 && bay(x, y) < 0.7) ? M.grassLt : (n < 0.32 && bay(x, y) < 0.6) ? M.grassDk : M.grass); }
      }
      // 小路：从门口弯到右下角
      for (let s = 0; s <= 60; s++) { const t = s / 60; const px = 61.5 + t * 44 + Math.sin(t * 3.4) * 7 * (1 - t * 0.3), py = 106 + t * 34, w = 3 + t * 9; for (let x = Math.floor(px - w); x <= px + w; x++) for (let y = Math.floor(py - 1.2); y <= py + 1.2; y++) { const e = Math.abs(x + 0.5 - px) / w; put(x, y, e > 0.82 ? M.pathDk : (hash(x, y, 3) < 0.07 ? M.pathDk : M.path)); } }
      // 灌木
      const bush = (cx, cy, rx, ry, seed) => { for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) { const d = ((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2; if (d > 1) continue; const v = 0.62 - ((x - cx) * 0.4 + (y - cy) * 0.9) / (rx * 2.2) + (hash(x, y, seed) - 0.5) * 0.35 + (bay(x, y) - 0.5) * 0.3; put(x, y, v > 0.7 ? M.leafLt : v > 0.4 ? M.leafMid : M.leaf); } };
      bush(36, 102, 8, 5.5, 11); bush(28, 106, 6, 4, 12); bush(88, 104, 5, 3.5, 13);
