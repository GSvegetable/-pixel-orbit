<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101326">
<title>Pixel Orbit</title>
<style>
:root{color-scheme:dark;background:#101326;color:#f4efdF;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{display:grid;grid-template-rows:auto 1fr;background:#101326}
nav{height:54px;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px}
button{appearance:none;border:1px solid #ffffff30;background:transparent;color:#c8c9d6;padding:8px 18px;font:inherit;font-size:12px;letter-spacing:.08em;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
button[aria-pressed=true]{background:#f4efdF;color:#171a2b;border-color:#f4efdF}
button:focus-visible{outline:2px solid #efa02c;outline-offset:3px}
iframe{display:block;width:100%;height:100%;border:0;background:#101326}
@media(max-width:480px){nav{height:48px}button{padding:7px 15px}}
</style>
</head>
<body>
<nav aria-label="选择 Pixel Orbit 场景">
<button type="button" data-scene="countryside" aria-pressed="true">田园</button>
<button type="button" data-scene="planet" aria-pressed="false">星球</button>
<button type="button" data-scene="world" aria-pressed="false">环形世界</button>
</nav>
<iframe id="scene" title="Pixel Orbit interactive scene" src="./pixel-orbit.html?display=1"></iframe>
<script>
(() => {
 const frame=document.getElementById('scene');
 const buttons=[...document.querySelectorAll('[data-scene]')];
 const sources={countryside:'./pixel-orbit.html?display=1',planet:'./pixel-orbit-planet.html?display=1',world:'./pixel-orbit-world.html?display=1'};
 buttons.forEach(button=>button.addEventListener('click',()=>{
   const scene=button.dataset.scene;
   if(frame.getAttribute('src')!==sources[scene])frame.src=sources[scene];
   buttons.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
 }));
})();
</script>
</body>
</html>
