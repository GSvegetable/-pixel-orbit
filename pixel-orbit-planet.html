<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pixel Orbit · 像素轨道开关</title>
<style>

/* Showcase: remove the full-viewport day/night fill and keep only a soft halo around the ring. */
html.showcase-mode,
html.showcase-mode body,
html.showcase-mode main {
  background: transparent !important;
  background-color: transparent !important;
}
html.showcase-mode body { position:relative; isolation:isolate; }
html.showcase-mode body::before {
  content:""; position:fixed; z-index:0; left:50%; top:50%;
  width:min(105vmin,760px); aspect-ratio:1; transform:translate(-50%,-50%);
  border-radius:50%; pointer-events:none;
  background:radial-gradient(circle,
    color-mix(in oklab,#e8c77f 30%,#547cc5 calc(var(--night,0)*30%)) 0%,
    color-mix(in oklab,#d9b66f 19%,#365b9c calc(var(--night,0)*22%)) 24%,
    color-mix(in oklab,#d5b878 9%,#263e70 calc(var(--night,0)*12%)) 43%,
    transparent 70%);
  filter:blur(34px); opacity:.9; transition:opacity 700ms ease,filter 700ms ease;
}
html.showcase-mode main { position:relative; z-index:1; }
html.showcase-mode .pixel-orbit {
  background: transparent !important;
  position: relative;
  z-index: 1;
  isolation: isolate;
}
html.showcase-mode .pixel-orbit::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -34%;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(ellipse at center,
    color-mix(in srgb, #f7c96b 48%, #5e86d8 calc(var(--night, 0) * 48%)) 0%,
    color-mix(in srgb, #efb94f 34%, #456fbd calc(var(--night, 0) * 34%)) 30%,
    color-mix(in srgb, #e6ad46 18%, #345b9d calc(var(--night, 0) * 22%)) 52%,
    transparent 76%);
  filter: blur(38px);
  opacity: .95;
  transform: scale(.98);
  transition: opacity 900ms ease, filter 900ms ease;
}
html.showcase-mode .pixel-orbit canvas {
  filter:drop-shadow(0 0 9px color-mix(in oklab,#f3d48f 34%,#6086d0 calc(var(--night,0)*38%)))
        drop-shadow(0 0 25px color-mix(in oklab,#e5bd70 22%,#4268ad calc(var(--night,0)*24%)))
        drop-shadow(0 12px 20px rgb(0 0 0 / .12));
}

/* Artwork showcase mode shared with the countryside version. */
html.showcase-mode, html.showcase-mode body { width:100%; height:100%; min-height:100%; overflow:hidden; }
html.showcase-mode body { display:grid; place-items:center; }
html.showcase-mode main { width:100%; height:100%; min-height:100%; padding:0; gap:0; display:grid; place-items:center; }
html.showcase-mode main > :not(.pixel-orbit) { display:none !important; }
html.showcase-mode .pixel-orbit { --orbit-size:min(66vmin, 360px); }
/* Art-directed crop: oversized artwork, shifted down to leave deliberate headroom. */
html.showcase-art-mode body { display:grid; place-items:start center; }
html.showcase-art-mode main {
  display:grid;
  place-items:start center;
  padding-top:20vh;
  overflow:visible;
}
html.showcase-art-mode .pixel-orbit {
  --orbit-size:min(150vmin, 760px);
  margin-top:0;
  transform:translateY(0);
}
html.display-mode, html.display-mode body { width:100%; height:100%; min-height:100%; overflow:hidden; }
html.display-mode body { display:grid; place-items:center; }
html.display-mode main { width:100%; height:100svh; min-height:100svh; padding:0; gap:0; }
html.display-mode main > :not(.pixel-orbit) { display:none !important; }
html.display-mode .pixel-orbit { --orbit-size:min(92vmin, 560px); }

  /* ---------- 页面：背景和文字随 --night（0 白天 → 1 夜晚）渐变 ---------- */
  :root { --night: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center;
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #f2e8d2; color: #1b2146;
    background: color-mix(in oklab, #f2e8d2 calc((1 - var(--night)) * 100%), #0c1030);
    color: color-mix(in oklab, #1b2146 calc((1 - var(--night)) * 100%), #f5ecd9);
  }
  main { display: grid; gap: 1.5rem; justify-items: center; padding: 2rem 1rem; text-align: center; }
  h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .hint { margin: 0; opacity: .65; font-size: .8rem; }
  output { font-size: 1.4rem; letter-spacing: .12em; font-variant-numeric: tabular-nums; min-height: 1.6em; }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; color: inherit; background: transparent; cursor: pointer; padding: .45rem .9rem;
    border: 2px solid currentColor; border-radius: 0; box-shadow: 3px 3px 0 currentColor; transition: transform .08s, box-shadow .08s;
  }
  button:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 currentColor; }
  button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 currentColor; }
  button:focus-visible { outline: 3px solid #efa02c; outline-offset: 3px; }
  button[aria-pressed="true"] { transform: translate(3px, 3px); box-shadow: inset 0 0 0 2px currentColor; }

  /* ---------- 组件：.pixel-orbit ---------- */
  .pixel-orbit {
    /* 想换配色只改这 5 个变量，所有场景颜色都由它们推导出来 */
    --orbit-bg: #f5ecd9; --orbit-surface: #8c9a62; --orbit-fg: #1b2146; --orbit-muted: #7f97b3; --orbit-accent: #efa02c;
    --orbit-size: min(84vw, 460px);
    width: var(--orbit-size); aspect-ratio: 1; display: grid; place-items: center;
    border-radius: 50%; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .pixel-orbit:active { cursor: grabbing; }
  .pixel-orbit:focus-visible { outline: 3px solid var(--orbit-accent); outline-offset: 8px; }
  .pixel-orbit canvas { display: block; image-rendering: pixelated; pointer-events: none; filter: drop-shadow(0 .9rem 1.4rem rgb(0 0 0 / .3)); }
/* Focused editor layout for the laboratory shell. */
html.lab-mode,html.lab-mode body{width:100%;min-height:100%;overflow-x:hidden}
html.lab-mode body{min-height:100svh;align-items:center}
html.lab-mode main{width:100%;max-width:1240px;min-height:100svh;margin:0 auto;padding:24px;gap:16px;grid-template-columns:minmax(280px,1fr) minmax(260px,360px);grid-template-areas:'art clock' 'art actions';align-items:center;justify-items:center}
html.lab-mode main>h1,html.lab-mode main>.hint,html.lab-mode main>noscript{display:none!important}
html.lab-mode main>.pixel-orbit{grid-area:art;--orbit-size:min(66vw,min(76svh,620px))}
html.lab-mode main>#clock{grid-area:clock;align-self:end}
html.lab-mode main>.row{grid-area:actions;align-self:start;flex-direction:column;width:100%;max-width:320px}
html.lab-mode main>.row button{width:100%}
@media(max-width:760px){html.lab-mode body{display:block}html.lab-mode main{min-height:100svh;padding:20px 16px;grid-template-columns:minmax(0,1fr);grid-template-areas:'art' 'clock' 'actions';gap:12px}html.lab-mode main>.pixel-orbit{--orbit-size:min(78vw,440px)}html.lab-mode main>.row{flex-direction:row;max-width:none}html.lab-mode main>.row button{flex:1}}

/* Transparent showcase with a restrained, time-responsive ambient halo. */
html.showcase-mode body {
  background: transparent !important;
  color: transparent;
  isolation: isolate;
}
html.showcase-mode body::before {
  content: "";
  position: fixed;
  z-index: 0;
  inset: -18%;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 48%,
      color-mix(in oklab, #f2e8d2 58%, #243b78 calc(var(--night, 0) * 58%)) 0%,
      color-mix(in oklab, #e8c98c 28%, #314d91 calc(var(--night, 0) * 28%)) 24%,
      transparent 66%);
  filter: blur(38px);
  opacity: .9;
  transition: opacity 500ms ease;
}
html.showcase-mode main { z-index: 1; }
html.showcase-mode .pixel-orbit canvas {
  filter:
    drop-shadow(0 0 12px color-mix(in oklab, #f4d99e 42%, #587acb calc(var(--night, 0) * 42%)))
    drop-shadow(0 14px 24px rgb(0 0 0 / .18));
}

/* Smooth transition between the cropped home preview and the complete artwork. */
html.showcase-mode body { position:relative; display:block; }
html.showcase-mode main {
  position:relative; display:block; width:100%; height:100%; min-height:100%;
  margin:0; padding:0; overflow:hidden;
}
html.showcase-mode .pixel-orbit {
  position:absolute; left:50%; top:50%;
  width:min(92vmin,560px); margin:0;
  transform-origin:top center;
  transform:translate(-50%,-50%) scale(1);
  transition:top 620ms cubic-bezier(.22,.8,.2,1),transform 620ms cubic-bezier(.22,.8,.2,1);
  will-change:transform,top;
}
html.showcase-art-mode .pixel-orbit {
  /* Home preview: horizontally centered, deliberately lower, with clear headroom.
     Expanded/full composition returns to top:50% and true viewport center. */
  top:20vh;
  transform-origin:top center;
  transform:translate(-50%,0) scale(1.36);
}
@media(prefers-reduced-motion:reduce) {
  html.showcase-mode .pixel-orbit { transition-duration:.01ms; }
}
</style>
</head>
<body>
<main>
  <h1>Pixel Orbit</h1>
  <!-- data-hour: "now"（本地时间）或 0–24；data-sync="root" 会把 --night 写到 <html>，让整个页面跟着变；data-autoplay="60" 表示 60 秒转一天 -->
  <div class="pixel-orbit" data-pixel-orbit data-hour="now" data-sync="root" aria-label="昼夜轨道开关"></div>
  <output id="clock" aria-live="off"></output>
  <div class="row">
    <button type="button" id="btn-day"><span>☀ 白天</span></button>
    <button type="button" id="btn-night"><span>☾ 夜晚</span></button>
    <button type="button" id="btn-auto" aria-pressed="false"><span>⟳ 自动</span></button>
  </div>
  <p class="hint">拖动圆环调整时间 · 点一下星球切换昼夜 · 键盘 ← → 微调，空格切换</p>
  <noscript><p>需要 JavaScript 才能显示像素星球。</p></noscript>
</main>

<script>
/* ============================================================
 *  Pixel Orbit —— 像素轨道开关
 *  圆环 = 太阳 / 月亮的轨道，环中是一颗小星球（房子 + 树）。
 *  拖动圆环调整时间；点一下星球（或太阳）在白天 / 夜晚之间切换。
 *  纯 JS，无依赖。调色只读取 5 个 CSS 变量，所有颜色都来自这 5 组 4 阶色带。
 * ============================================================ */
(() => {
  'use strict';
  const N = 152, CX = 76, CY = 76;            // 画布 152×152 像素，圆心 (76,76)
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const mix = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const bay = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;   // 4×4 有序抖动阈值 0..1
  const hash = (a, b, c = 0) => { let t = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177); t = Math.imul(t ^ (t >>> 13), 1274126177); return ((t ^ (t >>> 16)) >>> 0) / 4294967296; };

  // ---------- 调色：5 个基色各生成 4 阶明度（OKLab），共 20 色 ----------
  const lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const gam = (v) => { v = clamp(v); return 255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055); };
  const toLab = ([r, g, b]) => { const lr = lin(r), lg = lin(g), lb = lin(b); const l = Math.cbrt(0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb), m = Math.cbrt(0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb), s = Math.cbrt(0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb); return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s]; };
  const fromLab = (L, a, b) => { const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3; return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s]; };
  const tone = (rgb, L) => { const [, a, b] = toLab(rgb); let c = Math.hypot(a, b); const h = Math.atan2(b, a); for (let i = 0; i < 24; i++) { const o = fromLab(L, c * Math.cos(h), c * Math.sin(h)); if (o.every((v) => v > -0.002 && v < 1.002)) return o.map(gam); c *= 0.9; } return fromLab(L, 0, 0).map(gam); };
  const STEPS = [[0.76, 0.85, 0.93, 0.985], [0.4, 0.52, 0.64, 0.76], [0.17, 0.25, 0.33, 0.44], [0.5, 0.62, 0.74, 0.86], [0.5, 0.66, 0.8, 0.92]];
  const DEFAULTS = { bg: [245, 236, 217], surface: [140, 154, 98], fg: [27, 33, 70], muted: [127, 151, 179], accent: [239, 160, 44] };
  // 色带编号：C 奶油(bg) · G 草绿(surface) · I 深靛(fg) · U 雾蓝(muted) · A 琥珀(accent)，每组 +0..+3 由暗到亮
  const C = 0, G = 4, I = 8, U = 12, A = 16;
  const buildPalette = (colors = {}) => {
    const src = { ...DEFAULTS, ...colors }; const out = new Uint32Array(20);
    [src.bg, src.surface, src.fg, src.muted, src.accent].forEach((rgb, r) => STEPS[r].forEach((L, s) => { const [R, Gc, B] = tone(rgb, L); out[r * 4 + s] = (255 << 24) | (Math.round(B) << 16) | (Math.round(Gc) << 8) | Math.round(R); }));
    return out;
  };

  // ---------- 星球贴图：球面 3D 噪声 → 经纬度贴图（只算一次） ----------
  const vn3 = (x, y, z) => { const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z); const xf = x - xi, yf = y - yi, zf = z - zi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf); const h = (i, j, k) => hash(xi + i, yi + j, zi + k); const l = (a, b, t) => a + (b - a) * t; return l(l(l(h(0, 0, 0), h(1, 0, 0), u), l(h(0, 1, 0), h(1, 1, 0), u), v), l(l(h(0, 0, 1), h(1, 0, 1), u), l(h(0, 1, 1), h(1, 1, 1), u), v), w); };
  const fbm3 = (x, y, z) => vn3(x, y, z) * 0.55 + vn3(x * 2.1 + 7, y * 2.1 + 3, z * 2.1 + 5) * 0.3 + vn3(x * 4.3 + 1, y * 4.3 + 9, z * 4.3 + 2) * 0.15;
  const TW = 192, TH = 96;
  const buildTextures = () => {
    const land = new Float32Array(TW * TH), forest = new Float32Array(TW * TH), cloud = new Float32Array(TW * TH);
    for (let j = 0; j < TH; j++) for (let i = 0; i < TW; i++) {
      const lon = (i / TW) * TAU, lat = (j / TH - 0.5) * Math.PI; const px = Math.cos(lat) * Math.cos(lon), py = Math.sin(lat), pz = Math.cos(lat) * Math.sin(lon);
      land[j * TW + i] = fbm3(px * 1.75 + 11, py * 1.75 + 4, pz * 1.75 + 8); forest[j * TW + i] = fbm3(px * 4 + 3, py * 4 + 20, pz * 4 + 1); cloud[j * TW + i] = fbm3(px * 3.6 + 40, py * 4.8 + 2, pz * 3.6 + 17);
    }
    return { land, forest, cloud };
  };

  // ---------- 一天中的天空：每个关键时刻 4 个色阶（上 → 下），相邻两帧之间用抖动过渡 ----------
  const SKY = [
    [0, [I, I, I + 1, I + 2]], [5, [I, I + 1, I + 3, U]], [6.3, [I + 2, U, A + 1, A + 2]], [7.8, [U + 1, U + 2, U + 3, C + 2]], [12, [U + 1, U + 2, U + 3, C + 3]],
    [16.5, [U + 1, U + 2, U + 3, C + 2]], [18, [I + 3, U + 1, A + 2, A + 3]], [19.4, [I + 1, I + 3, U, A + 1]], [21, [I, I, I + 1, I + 2]], [24, [I, I, I + 1, I + 2]],
  ];
  // 色阶梯子：[夜, 黄昏, 金色时刻, 白天]
  const LAD = {
    ocean: [I + 1, I + 3, U, U + 1], land: [I + 1, G, G + 1, G + 2], forest: [I, I + 1, G, G + 1], sand: [I + 2, A, A + 1, C + 1], ice: [I + 2, U, C + 2, C + 3],
    cloud: [I + 2, U, C + 2, C + 3], wall: [I + 2, U + 1, A + 3, C + 3], roof: [I + 3, A, A + 1, A + 1], wood: [I + 1, I + 3, A, A], leaf: [I + 1, G, G + 1, G + 2], leaf2: [I + 1, G + 1, G + 2, G + 3],
    stone: [I + 2, I + 3, U, U + 1], glass: [A + 3, A + 2, U + 2, U + 1], skyCloud: [I + 2, U, A + 3, C + 3],
  };
  const SPR = {
    house: ['......r......', '.....rrr..cc.', '....rrrrr.cc.', '...rrrrrrrrc.', '..rrrrrrrrrr.', '.rrrrrrrrrrr.', 'rrrrrrrrrrrrr', '.wwwwwwwwwww.', '.wkkwwwwwkkw.', '.wkkwwwwwkkw.', '.wwwwdddwwww.', '.wwwwdddwwww.'],
    tree: ['...ggg...', '..ggGgg..', '.ggggGgg.', 'ggGgggggg', '.ggggGgg.', '..ggggg..', '....t....', '....t....', '....t....'],
    bush: ['.ggg.', 'gGggg', 'ggggg'],
  };
  const SPR_MAT = { r: 'roof', w: 'wall', k: 'glass', d: 'wood', c: 'stone', g: 'leaf', G: 'leaf2', t: 'wood' };

  const createRenderer = (colors) => {
    const pal = buildPalette(colors); const tex = buildTextures(); const buf = new Uint32Array(N * N);
    const st = { smoke: [], smokeT: 0, shoot: null, shootT: 4 };
    const PR = 31, PX = CX, PY = 82;                      // 星球半径 / 圆心
    const WORLD = 61.5, BEZ = 62;                           // 天穹半径 / 圆环内沿
    const BEAD_R = 68;                                      // 太阳月亮沿轨道运行的半径
    const CLOUDS = [[-30, 34, 1, 2.2], [40, 24, 0.8, 1.5], [95, 46, 1.1, 2.8], [150, 30, 0.7, 1.9]];
    const BIRDS = [[0, 30, 6], [70, 40, 5.2]];

    const render = (hour, t = 0, opts = {}) => {
      const calm = !!opts.calm; const hh = ((hour % 24) + 24) % 24;
      const th = ((hh - 12) / 24) * TAU; const sx = Math.sin(th), sy = -Math.cos(th), cs = Math.cos(th);   // 太阳方向（屏幕）
      const Lk = 0.62; let Lx = sx * Lk, Ly = sy * Lk, Lz = 0.85 * cs + 0.15; const Ll = Math.hypot(Lx, Ly, Lz); Lx /= Ll; Ly /= Ll; Lz /= Ll;
      const Hx = Lx, Hy = Ly, Hz = Lz + 1, Hl = Math.hypot(Hx, Hy, Hz);                                    // 高光半程向量
      const night = clamp(smooth(18.4, 20.6, hh) + (1 - smooth(4.6, 6.2, hh)));
      const tf0 = clamp((cs + 0.35) / 0.9) * 3;                                                              // 天空 / 房子的色阶（带暮光滞后）
      const sunTone = tf0, spin = calm ? 0.6 : t * 0.16;
      // 关键帧过渡
      let k = 0; while (k < SKY.length - 2 && hh >= SKY[k + 1][0]) k++; const pk = smooth(SKY[k][0], SKY[k + 1][0], hh); const kA = SKY[k][1], kB = SKY[k + 1][1];
      const sunX = CX + sx * BEAD_R, sunY = CY + sy * BEAD_R, moonX = CX - sx * BEAD_R, moonY = CY - sy * BEAD_R;
      const sunUp = clamp(cs * 0.6 + 0.55);                                                                  // 太阳亮度
      const spinLon = spin; const cloudLon = spin * 1.35;
      const pick = (lad, tfl, x, y) => lad[clamp(Math.round(tfl + (bay(x, y) - 0.5) * 1.05), 0, 3)];
      // 星球表面某像素的颜色
      const planet = (x, y, dxp, dyp) => {
        const nx = dxp / PR, ny = dyp / PR, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
        const dot = nx * Lx + ny * Ly + nz * Lz; const tf = clamp((dot + 0.05) / 0.7) * 3; const ti = clamp(Math.round(tf + (bay(x, y) - 0.5) * 1.1), 0, 3);
        const lon = Math.atan2(nz, nx) + spinLon, lat = Math.asin(clamp(-ny, -1, 1)); const u = (((lon / TAU) % 1) + 1) % 1, v = (lat / Math.PI + 0.5);
        const ti_ = Math.min(TW - 1, Math.floor(u * TW)), tj = Math.min(TH - 1, Math.floor(v * TH)); const li = tj * TW + ti_;
        const lv = tex.land[li]; let mat;
        if (ny > 0.9) mat = LAD.ice;                 // 南极冰盖

<script>
  // ---------- 页面胶水代码：只用到组件的公开 API ----------
  (() => {
    const ring = document.querySelector('.pixel-orbit').__pixelOrbit;
    const clock = document.getElementById('clock');
    const show = (d) => { clock.textContent = d.time + ' · ' + d.label; };
    ring.onChange(show); show({ time: document.querySelector('.pixel-orbit').getAttribute('aria-valuetext').split(' · ')[0], label: document.querySelector('.pixel-orbit').getAttribute('aria-valuetext').split(' · ')[1] });
    document.getElementById('btn-day').onclick = () => ring.setHour(12);
    document.getElementById('btn-night').onclick = () => ring.setHour(23);
    const auto = document.getElementById('btn-auto');
    auto.onclick = () => { const on = auto.getAttribute('aria-pressed') !== 'true'; auto.setAttribute('aria-pressed', on); ring.setAutoplay(on ? 48 : 0); };

  })();
</script>

<script>
(() => {
  if (window.parent === window) return;
  const setComposition = composition => {
    if (composition !== "art" && composition !== "full") return;
    document.documentElement.classList.toggle("showcase-art-mode", composition === "art");
    document.documentElement.classList.toggle("showcase-full-mode", composition === "full");
  };
  window.addEventListener("message", event => {
    if (event.source !== window.parent || !event.data || event.data.type !== "pixel-orbit-composition") return;
    setComposition(event.data.composition);
  });

  // Wait until the browser has painted the artwork, not merely loaded the HTML.
  const announceReady = () => {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      window.parent.postMessage({ type: "pixel-orbit-ready" }, "*");
    }));
  };
  if (document.readyState === "complete") announceReady();
  else window.addEventListener("load", announceReady, { once: true });
})();
</script>
