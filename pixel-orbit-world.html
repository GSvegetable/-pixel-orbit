<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Orbit · 像素环形世界</title>
<style>
  /* ---------- 页面：背景和文字随 --night（0 白天 → 1 夜晚）渐变 ---------- */
  :root { --night: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center;
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #f2e8d2; color: #1b2146;
    background: color-mix(in oklab, #f2e8d2 calc((1 - var(--night)) * 100%), #0c1030);
    color: color-mix(in oklab, #1b2146 calc((1 - var(--night)) * 100%), #f5ecd9);
  }
  main { display: grid; gap: 1.5rem; justify-items: center; padding: 2rem 1rem; text-align: center; }
  h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .hint { margin: 0; opacity: .65; font-size: .8rem; }
  output { font-size: 1.4rem; letter-spacing: .12em; font-variant-numeric: tabular-nums; min-height: 1.6em; }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; color: inherit; background: transparent; cursor: pointer; padding: .45rem .9rem;
    border: 2px solid currentColor; border-radius: 0; box-shadow: 3px 3px 0 currentColor; transition: transform .08s, box-shadow .08s;
  }
  button:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 currentColor; }
  button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 currentColor; }
  button:focus-visible { outline: 3px solid #efa02c; outline-offset: 3px; }
  button[aria-pressed="true"] { transform: translate(3px, 3px); box-shadow: inset 0 0 0 2px currentColor; }

  /* ---------- 组件：.pixel-orbit ---------- */
  .pixel-orbit {
    /* 想换配色只改这 5 个变量，画面里所有颜色都由它们推导出来 */
    --orbit-bg: #f5ecd9; --orbit-surface: #8c9a62; --orbit-fg: #1b2146; --orbit-muted: #7f97b3; --orbit-accent: #efa02c;
    --orbit-size: min(84vw, 460px);
    width: var(--orbit-size); aspect-ratio: 1; display: grid; place-items: center;
    border-radius: 50%; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .pixel-orbit:active { cursor: grabbing; }
  .pixel-orbit:focus-visible { outline: 3px solid var(--orbit-accent); outline-offset: 8px; }
  .pixel-orbit canvas { display: block; image-rendering: pixelated; pointer-events: none; filter: drop-shadow(0 .9rem 1.4rem rgb(0 0 0 / .3)); }

/* Portfolio and clean-player embedding modes for the third visual edition.
   早先这里自己另写了一套 absolute + top:50% 的定位，结果有两处硬伤：
   ① 漏了隐藏页面 chrome 的规则 → 标题、时钟、按钮、提示文字全压在画面上；
   ② main 的高度没撑满嵌套 iframe → 环形世界被挤成顶部一条窄带。
   现在直接沿用星球版 / 田园版那套已经验证过的 showcase 模式。 */
html.display-mode,html.display-mode body{width:100%;height:100%;min-height:100%;overflow:hidden}
html.display-mode body{display:grid;place-items:center}
html.display-mode main{width:100%;height:100svh;min-height:100svh;padding:0;gap:0;align-content:center}
html.display-mode main>:not(.pixel-orbit){display:none!important}
html.display-mode .pixel-orbit{--orbit-size:min(64svh,88vw,520px)}
html.showcase-mode,html.showcase-mode body{background:transparent!important;background-color:transparent!important}
html.showcase-mode,html.showcase-mode body{width:100%;height:100%;min-height:100%;overflow:hidden}
html.showcase-mode body{display:grid;place-items:center;position:relative;isolation:isolate}
html.showcase-mode body::before{content:"";position:fixed;z-index:0;left:50%;top:50%;width:min(105vmin,760px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;background:radial-gradient(circle,color-mix(in oklab,#e8c77f 26%,#547cc5 calc(var(--night,0)*28%)) 0%,color-mix(in oklab,#d9b66f 15%,#365b9c calc(var(--night,0)*20%)) 30%,transparent 70%);filter:blur(34px);opacity:.9}
html.showcase-mode main{position:relative;z-index:1;width:100%;height:100%;min-height:100%;padding:0;gap:0;display:grid;place-items:center}
html.showcase-mode main>:not(.pixel-orbit){display:none!important}
html.showcase-mode .pixel-orbit{--orbit-size:min(66vmin,360px);position:relative;z-index:1;isolation:isolate}
/* 闭合卡片里的艺术裁切：作品放大后下移，留出刻意的上方空间。 */
html.showcase-art-mode body{display:grid;place-items:start center}
html.showcase-art-mode main{display:grid;place-items:start center;padding-top:20vh;overflow:visible}
html.showcase-art-mode .pixel-orbit{--orbit-size:min(150vmin,760px);margin-top:0;transform:translateY(0)}
@media(prefers-reduced-motion:reduce){html.showcase-mode main{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Pixel Orbit</h1>
  <!-- data-hour: "now"（本地时间）或 0–24；data-sync="root" 会把 --night 写到 <html>，让整个页面跟着变；data-autoplay="60" 表示 60 秒转一天 -->
  <div class="pixel-orbit" data-pixel-orbit data-hour="now" data-sync="root" aria-label="昼夜环形世界开关"></div>
  <output id="clock" aria-live="off"></output>
  <div class="row">
    <button type="button" id="btn-day"><span>☀ 白天</span></button>
    <button type="button" id="btn-night"><span>☾ 夜晚</span></button>
    <button type="button" id="btn-auto" aria-pressed="false"><span>⟳ 自动</span></button>
  </div>
  <p class="hint">拖动圆环、太阳或月亮调整时间 · 点一下天空切换昼夜 · 键盘 ← → 微调，空格切换</p>
  <noscript><p>需要 JavaScript 才能显示像素世界。</p></noscript>
</main>

<script>
/* ============================================================
 *  Pixel Orbit —— 像素环形世界开关
 *  圆形窗口里是一座田园小屋，窗口外的表盘圆环上有一枚旋钮（白天是太阳、夜里是月亮）。
 *  拖动圆环调整时间；点一下画面（或旋钮）在白天 / 夜晚之间切换。
 *  纯 JS，无依赖。调色只读取 5 个 CSS 变量，所有颜色都来自这 5 组 4 阶色带。
 * ============================================================ */
(() => {
  'use strict';
  const N = 168, CX = 84, CY = 84;            // 画布 168×168 像素，圆心 (84,84)
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const mix = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const bay = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;   // 4×4 有序抖动阈值 0..1
  const hash = (a, b, c = 0) => { let t = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177); t = Math.imul(t ^ (t >>> 13), 1274126177); return ((t ^ (t >>> 16)) >>> 0) / 4294967296; };

  // ---------- 调色：5 个基色各生成 4 阶明度（OKLab），共 20 色 ----------
  const lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const gam = (v) => { v = clamp(v); return 255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055); };
  const toLab = ([r, g, b]) => { const lr = lin(r), lg = lin(g), lb = lin(b); const l = Math.cbrt(0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb), m = Math.cbrt(0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb), s = Math.cbrt(0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb); return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s]; };
  const fromLab = (L, a, b) => { const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3; return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s]; };
  const tone = (rgb, L) => { const [, a, b] = toLab(rgb); let c = Math.hypot(a, b); const h = Math.atan2(b, a); for (let i = 0; i < 24; i++) { const o = fromLab(L, c * Math.cos(h), c * Math.sin(h)); if (o.every((v) => v > -0.002 && v < 1.002)) return o.map(gam); c *= 0.9; } return fromLab(L, 0, 0).map(gam); };
  const STEPS = [[0.76, 0.85, 0.93, 0.985], [0.4, 0.52, 0.64, 0.76], [0.17, 0.25, 0.33, 0.44], [0.5, 0.62, 0.74, 0.86], [0.5, 0.66, 0.8, 0.92]];
  const DEFAULTS = { bg: [245, 236, 217], surface: [140, 154, 98], fg: [27, 33, 70], muted: [127, 151, 179], accent: [239, 160, 44] };
  // 色带编号：C 奶油(bg) · G 草绿(surface) · I 深靛(fg) · U 雾蓝(muted) · A 琥珀(accent)，每组 +0..+3 由暗到亮
  const C = 0, G = 4, I = 8, U = 12, A = 16;
  const buildPalette = (colors = {}) => {
    const src = { ...DEFAULTS, ...colors }; const out = new Uint32Array(20);
    [src.bg, src.surface, src.fg, src.muted, src.accent].forEach((rgb, r) => STEPS[r].forEach((L, s) => { const [R, Gc, B] = tone(rgb, L); out[r * 4 + s] = (255 << 24) | (Math.round(B) << 16) | (Math.round(Gc) << 8) | Math.round(R); }));
    return out;
  };



  // ---------- 一天中的天空：每个关键时刻 4 个色阶（上 → 下）。星球上每个方向有各自的「当地时间」 ----------
  const SKY = [
    [12, [U + 1, U + 2, U + 3, U + 3]], [16.5, [U + 1, U + 2, U + 3, U + 3]], [18, [I + 3, U + 1, A + 2, A + 3]], [19.4, [I + 1, I + 3, U, A + 1]], [21, [I, I, I + 1, I + 2]], [24, [I, I, I, I + 1]],
  ];
  // 材质：每种材质 4 个色阶 [夜, 黄昏, 金色时刻, 白天]（思路和你原项目的 MATS 一样）
  const MATS = [
    ['hillFar', [I + 1, I + 3, U + 1, U + 2]], ['hillNear', [I, I + 2, U, U + 1]], ['grass', [I + 1, G, G + 1, G + 2]], ['grassLt', [I + 2, G + 1, G + 2, G + 3]], ['grassDk', [I, I + 1, G, G + 1]],
    ['leaf', [I, I + 1, G, G + 1]], ['leafMid', [I + 1, G, G + 1, G + 2]], ['leafLt', [I + 2, G + 1, G + 2, G + 3]], ['trunk', [I + 1, I + 3, A, A]], ['trunkLt', [I + 2, A, A + 1, A + 1]],
    ['wall', [I + 2, U + 1, A + 3, C + 3]], ['wallWarm', [I + 1, U, A + 1, A + 2]], ['roof', [I, I + 1, I + 2, I + 3]], ['roofLt', [I + 1, I + 2, I + 3, U]], ['roofRed', [I + 1, I + 3, A, A + 1]],
    ['wood', [I + 1, I + 3, A, A]], ['woodLt', [I + 2, A, A + 1, A + 1]], ['win', [A + 3, A + 2, U + 2, U + 1]], ['stone', [I + 1, I + 2, U, U + 1]], ['stoneLt', [I + 3, U, U + 1, U + 2]],
    ['flowerA', [I + 2, A, A + 2, A + 2]], ['flowerC', [I + 3, U + 1, C + 3, C + 3]], ['water', [I + 1, I + 3, U, U + 1]], ['waterLt', [I + 3, U, U + 2, U + 3]],
    ['soil', [I + 1, I + 3, A, A]], ['soilDk', [I, I + 1, I + 3, I + 3]], ['rock', [I + 1, I + 2, I + 3, U]], ['rockLt', [I + 2, I + 3, U, U + 1]], ['rockDk', [I, I + 1, I + 2, I + 3]], ['snow', [I + 2, U, C + 2, C + 3]],
    ['crystal', [C + 3, U + 3, U + 2, U + 2]], ['lantern', [A + 3, A + 3, A + 2, A + 1]], ['smoke', [I + 3, U, C + 2, C + 3]], ['glow', [A + 1, A, A, A]], ['hair', [I, I, I + 1, I + 1]],
    ['skin', [I + 3, A + 1, A + 3, A + 3]], ['shirt', [I + 2, A, A + 1, A + 2]], ['pants', [I + 1, I + 2, I + 3, I + 2]],
  ];
  const M = {}; MATS.forEach(([name], i) => { M[name] = i + 1; });            // 0 = 空（天空）
  const LAD = MATS.map(([, l]) => l);
  const RG = 62, W = 390, H = 34, HB = 5;                                      // 地面（圆环内壁）半径；全景带宽 390（=内壁周长），高 34（-5..28）
  const ORB = 24, R_OUT = 80.6;                                                // 太阳月亮的轨道半径 / 圆环外沿
  const WALKER = ['.hhh.', '.hsh.', '.ttt.', 'ttttt', '.ttt.', '.ppp.', '.p.p.'];
  const WCH = { h: M.hair, s: M.skin, t: M.shirt, p: M.pants };


  const createRenderer = (colors) => {
    const pal = buildPalette(colors); const buf = new Uint32Array(N * N);
    // ============ 1. 全景带：把一整圈风景画成一条长图，再用极坐标卷到圆环内壁上 ============
    // 约定：u 沿内壁向右（屏幕上 = 逆时针，从正下方起算），h = 离开地面的高度（朝圆心为正）
    const stM = new Uint8Array(W * H), stS = new Int8Array(W * H);          // 材质 / 受光侧（-100 左 … +100 右）
    const sp = (u, h, m, s = 0) => { u = ((Math.round(u) % W) + W) % W; h = Math.round(h); const iv = h + HB; if (iv < 0 || iv >= H) return; stM[iv * W + u] = m; stS[iv * W + u] = Math.round(clamp(s, -1, 1) * 100); };
    const sx = (x, half) => clamp(x / half, -1, 1);
    const box = (uc, x0, x1, h0, h1, m, half) => { for (let x = x0; x <= x1; x++) for (let h = h0; h <= h1; h++) sp(uc + x, h, m, sx(x, half)); };
    const n2 = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); return mix(mix(hash(xi, yi, 5), hash(xi + 1, yi, 5), u), mix(hash(xi, yi + 1, 5), hash(xi + 1, yi + 1, 5), u), v); };
    const deg = (d) => (d / 360) * W;
    const cottage = (uc) => {
      box(uc, -12, 12, 0, 1, M.stone, 12); box(uc, -11, 11, 2, 12, M.wall, 11);
      for (let x = -11; x <= 11; x += 1) for (let h = 3; h <= 12; h += 3) if ((x + h) % 4 === 0) sp(uc + x, h, M.wallWarm, sx(x, 11));
      box(uc, -13, 13, 13, 13, M.wood, 13);
      for (let h = 14; h <= 23; h++) { const hw = Math.round(13.4 - (h - 14) * 1.32); if (hw < 1) { sp(uc, h, M.roofLt, 0); continue; } for (let x = -hw; x <= hw; x++) { const even = h % 2 === 0; let m = even ? M.roofLt : M.roof; if (even && (x + ((h >> 1) & 1) * 2) % 4 === 0) m = M.roof; sp(uc + x, h, m, sx(x, 13)); } }
      for (let x = 5; x <= 9; x++) for (let h = 16; h <= 25; h++) sp(uc + x, h, h === 25 ? M.stoneLt : (x === 5 ? M.stoneLt : M.stone), x === 5 ? -0.6 : 0.6);
      box(uc, -2, 2, 2, 9, M.wood, 3); box(uc, -1, 1, 3, 8, M.woodLt, 3); sp(uc + 1, 5, M.lantern, 0); sp(uc - 2, 10, M.wood, 0); sp(uc + 2, 10, M.wood, 0); sp(uc, 10, M.wood, 0);
      for (const cx of [-7, 7]) { box(uc, cx - 2, cx + 2, 6, 11, M.wood, 11); box(uc, cx - 1, cx + 1, 7, 10, M.win, 11); sp(uc + cx, 8, M.wood, 0); sp(uc + cx, 9, M.wood, 0); box(uc, cx - 2, cx + 2, 4, 5, M.wood, 11); for (let i = -2; i <= 2; i++) sp(uc + cx + i, 5, (i + cx) & 1 ? M.flowerC : M.flowerA, 0); }
    };
    const windmill = (uc) => {
      for (let h = 0; h <= 16; h++) { const hw = Math.round(5.6 - h * 0.14); for (let x = -hw; x <= hw; x++) sp(uc + x, h, (h % 4 === 3 && Math.abs(x) < hw) ? M.stoneLt : M.wall, sx(x, hw)); }
      box(uc, -1, 1, 0, 5, M.wood, 2); box(uc, -1, 0, 9, 11, M.win, 2); sp(uc + 1, 9, M.wood, 0);
      for (let h = 17; h <= 22; h++) { const hw = Math.round(5 - (h - 17) * 0.85); for (let x = -hw; x <= hw; x++) sp(uc + x, h, h % 2 ? M.roofRed : M.roofLt, sx(x, 5)); } sp(uc, 23, M.roofLt, 0);
    };
    const pine = (uc, hgt, big) => {
      sp(uc, 0, M.trunk, 0); sp(uc, 1, M.trunk, 0); sp(uc + 1, 0, M.trunk, 0.5); sp(uc + 1, 1, M.trunk, 0.5);
      for (let h = 2; h <= hgt; h++) { const fr = (hgt - h) / (hgt - 1); let hw = Math.round(fr * big + ((hgt - h) % 4 === 0 ? 0 : 0.7)); if (h === hgt) hw = 0; for (let x = -hw; x <= hw + 1; x++) sp(uc + x, h, (hash(uc + x, h, 2) < 0.18 && fr > 0.2) ? M.leafMid : (x < -hw / 2 ? M.leafMid : M.leaf), sx(x - 0.5, Math.max(hw, 2))); }
    };
    const house = (uc, w, hb, rh, wallM, roofM) => {
      const hw = (w - 1) / 2; box(uc, -Math.floor(hw), Math.ceil(hw), 0, hb, wallM, hw + 0.5);
      for (let h = hb + 1; h <= hb + rh; h++) { const r = Math.round((hw + 1.5) * (1 - (h - hb - 1) / rh)); for (let x = -r; x <= r; x++) sp(uc + x, h, h % 2 ? roofM : M.roofLt, sx(x, hw + 1.5)); }
      box(uc, 0, 1, 0, 3, M.wood, 2);
      for (let wx = -Math.floor(hw) + 1; wx <= Math.ceil(hw) - 2; wx += 4) { sp(uc + wx, hb - 3, M.win, 0); sp(uc + wx + 1, hb - 3, M.win, 0); sp(uc + wx, hb - 2, M.win, 0); sp(uc + wx + 1, hb - 2, M.win, 0); }
    };
    const peak = (uc, hgt, hw) => { for (let x = -hw; x <= hw; x++) { const top = Math.round(hgt * (1 - Math.abs(x) / hw) + (n2(x * 0.5 + uc, 3) - 0.5) * 2.2); for (let h = 0; h <= top; h++) sp(uc + x, h, h > hgt * 0.62 + (n2(x * 0.7, h * 0.3) - 0.5) * 3 ? M.snow : (x < 0 ? M.hillFar : M.hillNear), sx(x, hw) * 1.1); } };
    const oak = (uc) => {
      for (let h = 0; h <= 9; h++) { sp(uc - 1, h, M.trunk, -0.6); sp(uc, h, M.trunkLt, 0); sp(uc + 1, h, M.trunk, 0.6); } sp(uc - 2, 0, M.trunk, -0.6); sp(uc + 2, 0, M.trunk, 0.6);
      const blobs = [[0, 15, 8.2], [-6.2, 12, 5.4], [6.2, 12, 5.4], [0, 20, 4.4], [-3.6, 18.5, 4.4]];
      for (let h = 6; h <= 25; h++) for (let x = -13; x <= 13; x++) { let inside = false; for (const [bx, bh, br] of blobs) if ((x - bx) ** 2 + (h - bh) ** 2 <= br * br) { inside = true; break; } if (!inside) continue; const v = 0.45 + (h - 15) * 0.035 + (n2(x * 0.5 + uc, h * 0.5) - 0.5) * 0.5 + (hash(x + uc, h, 9) - 0.5) * 0.2; sp(uc + x, h, v > 0.68 ? M.leafLt : v > 0.4 ? M.leafMid : M.leaf, sx(x, 11)); }
    };

<script>
  // ---------- 页面胶水代码：只用到组件的公开 API ----------
  (() => {
    // 组件在 DOMContentLoaded 才 mount，这段胶水代码在解析期就会跑到，
    // 所以这里不能直接假设 el.__pixelOrbit 已经存在，否则会拿到 undefined。
    const el = document.querySelector('.pixel-orbit'); const ring = el.__pixelOrbit || window.PixelOrbit.mount(el);
    const clock = document.getElementById('clock');
    const show = (d) => { clock.textContent = d.time + ' · ' + d.label; };
    ring.onChange(show); const [t0, l0] = el.getAttribute('aria-valuetext').split(' · '); show({ time: t0, label: l0 });

    const auto = document.getElementById('btn-auto');
    auto.onclick = () => { const on = auto.getAttribute('aria-pressed') !== 'true'; auto.setAttribute('aria-pressed', on); ring.setAutoplay(on ? 48 : 0); };

  })();

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const root = document.documentElement;
  if (params.get('display') === '1') root.classList.add('display-mode');
  if (params.get('showcase') === '1') root.classList.add('showcase-mode');
  const setComposition = value => {
    if (value !== 'art' && value !== 'full') return;
    root.classList.toggle('showcase-art-mode', value === 'art');
    root.classList.toggle('showcase-full-mode', value === 'full');
  };
  setComposition(params.get('composition') || 'full');
  if (window.parent === window) return;
  let painted = false;
  const announceReady = () => {
    if (painted) window.parent.postMessage({type:'pixel-orbit-ready',scene:'world'}, '*');
  };
  window.addEventListener('message', event => {
    if (event.source !== window.parent || !event.data) return;
    if (event.data.type === 'pixel-orbit-composition') setComposition(event.data.composition);
    if (event.data.type === 'pixel-orbit-ping') announceReady();
  });
  const markPainted = () => requestAnimationFrame(() => requestAnimationFrame(() => {
    painted = true;
    announceReady();
  }));
  if (document.readyState === 'complete') markPainted();
  else window.addEventListener('load', markPainted, {once:true});
})();
</script>
